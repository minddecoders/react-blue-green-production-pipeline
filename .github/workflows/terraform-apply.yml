name: "GitOps - Auto Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Target Infrastructure Environment Workspace Tier to Deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write # 🔑 Grants permission to dynamically mint keyless AWS OIDC tokens!

# 🏷️ GLOBAL DYNAMIC VERSIONING
env:
  RELEASE_VERSION: "v1.${{ github.run_number }}"

jobs:
  # ============================================================================
  # JOB 1: AUTOMATED VITE-REACT DOCKERIZATION ENGINE
  # ============================================================================
  build-and-push-image:
    name: "Compile React Code & Push to DockerHub"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Codebase Repository"
        uses: actions/checkout@v4

      - name: "Log in to DockerHub Registry"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build Production Multi-Stage Container Image"
        uses: docker/build-push-action@v5
        with:
          context: ./react-recipe-app
          file: ./react-recipe-app/Dockerfile
          push: true
          tags: |
            minddecoders/react-recipeapp-blue-green-production:v1.4
            minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}
       
  # ============================================================================
  # JOB 2: STAGE IMMUTABLE GREEN ENVIRONMENT (0% Live Traffic)
  # ============================================================================
  terraform-stage-green:
    name: "Deploy Green Tier (Offline Staging)"
    runs-on: ubuntu-latest
    needs: build-and-push-image
    defaults:
      run:
        shell: bash
        working-directory: ./application-infra
    # 📡 SHARE TELEMETRY: Passes the ALB DNS output to the next testing job dynamically
    outputs:
      alb_dns: ${{ steps.parse_outputs.outputs.ALB_DNS }}

    steps:
      - name: "Checkout Repository Code"
        uses: actions/checkout@v4

      - name: "Authenticate to AWS using OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: "Initialize S3 Remote Backend Connection"
        run: terraform init -input=false

      - name: "Select or Create Target Workspace Environment"
        run: |
          terraform workspace select ${{ github.event.inputs.environment }} || terraform workspace new ${{ github.event.inputs.environment }}
      
      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive

      - name: "Execute Code Semantics Validation Gate"
        run: terraform validate
      
      - name: "Generate Live Cloud Infrastructure Plan"
        run: terraform plan -input=false
        env:
          TF_VAR_green_container_image: "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}"
          TF_VAR_blue_traffic_weight: 100
          TF_VAR_green_traffic_weight: 0

      - name: "Generate and Apply Live Cloud Infrastructure"
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_green_container_image: "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}"
          TF_VAR_blue_traffic_weight: 100
          TF_VAR_green_traffic_weight: 0

      # 🔍 TELEMETRY HOOK: Extracts the URL from outputs.tf to use for the smoke test
      # Format mapping uses standard structural lookup scripts to read the alb_dns_name string value.
      # The source can be validated against your project [outputs.tf] properties context.
      # Anchor lookup attributes read the true environment canonical record cleanly.
      # The anchor value can be referenced directly using standard mapping tags:
      # See specific resource extraction tracking properties fields:
      - name: "Collect Dynamic Telemetry Context"
        id: parse_outputs
        run: |
          ALB_RAW=$(terraform output -raw alb_dns_name)
          echo "ALB_DNS=${ALB_RAW}" >> $GITHUB_OUTPUT

  # ============================================================================
  # NEW JOB: AUTOMATED SMOKE/HEALTH TESTING GATE
  # ============================================================================
  automated-health-test:
    name: "Run Smoke & Health Tests"
    runs-on: ubuntu-latest
    needs: terraform-stage-green
    steps:
       # ✨ ENTERPRISE RETRY LOOP: Intelligently polls the AWS Load Balancer up to 12 times until healthy
   
      - name: "Awaiting AWS Container Ingress Initialization"
        shell: bash
        run: |
          TARGET_URL="${{ needs.terraform-stage-green.outputs.alb_dns }}"

          if [ -z "$TARGET_URL" ]; then
            echo "ERROR: ALB DNS output is empty."
            exit 1
          fi

          echo "Starting Green environment smoke test..."
          echo "Target: $TARGET_URL"

          for i in {1..12}; do
            CURL_EXIT=0

            STATUS_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 \
              --max-time 10 \
              -H "X-Blue-Green-Test: true" \
              "$TARGET_URL") || CURL_EXIT=$?

            if [ "$CURL_EXIT" -eq 0 ] && [ "$STATUS_CODE" = "200" ]; then
              echo "SUCCESS: Green environment returned HTTP 200."
              exit 0
            fi

            echo "Attempt $i/12 failed: curl exit=$CURL_EXIT, HTTP=${STATUS_CODE:-none}"

            if [ "$i" -lt 12 ]; then
              echo "Retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "ERROR: Green smoke test failed after 12 attempts."
          exit 1


  # ============================================================================
  # JOB 3: THE SWAP CONTROLLER (Flips Traffic to 100% Green Instantly)
  # ============================================================================
  promote-green-to-live:
    name: "Execute Zero-Downtime Traffic Switch"
    runs-on: ubuntu-latest
    needs: automated-health-test # 🔒 CHANGED: Will only run if the automated smoke tests pass perfectly!
    environment: production-gate # ⏸️ Still pauses here for your final sign-off click!
    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: "Checkout Repository Code"
        uses: actions/checkout@v4

      - name: "Authenticate to AWS using OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: "Initialize S3 Remote Backend Connection"
        run: terraform init -input=false

      - name: "Select Active Workspace"
        run: terraform workspace select ${{ github.event.inputs.environment }}

      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive

      - name: "Execute Code Semantics Validation Gate"
        run: terraform validate
      
      - name: "Generate Live Cloud Infrastructure Plan"
        run: terraform plan -input=false
        env:
          TF_VAR_green_container_image: "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}"
          TF_VAR_blue_traffic_weight: 100
          TF_VAR_green_traffic_weight: 0

      - name: "Modify ALB Rules (Blue: 0% / Green: 100%)"
        run: terraform apply -auto-approve -target=aws_lb_listener_rule.blue_green_router -input=false
        env:
          TF_VAR_green_container_image: "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}"
          TF_VAR_blue_traffic_weight: 0
          TF_VAR_green_traffic_weight: 100
          
      - name: "Record Green Release as Approved Production Image"
        run: |
          aws ssm put-parameter \
            --name "/current/react-recipeapp-blue-green-image" \
            --type "String" \
            --value "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}" \
            --overwrite \
            --region eu-west-1  
 # ============================================================================
  # 🚨 JOB 5: AUTOMATED DEEP ROLLBACK (Fires ONLY if Smoke Test Fails)
  # ============================================================================
  automated-rollback-cleanup:
    name: "Tear Down Broken Green Release"
    runs-on: ubuntu-latest
    needs: automated-health-test
    if: ${{ always() && needs.automated-health-test.result == 'failure' }}
    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: "Checkout Repository Code"
        uses: actions/checkout@v4

      - name: "Authenticate to AWS using OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: "Initialize S3 Remote Backend Connection"
        run: terraform init -input=false

      - name: "Select Active Workspace"
        run: terraform workspace select ${{ github.event.inputs.environment }}

      # ✨ FIXED INDENTATION & COMPREHENSIVE WIPE
      # Runs a full apply passing var.green_ecs_scale=0 to actively terminate the broken Fargate tasks!
      - name: "Rollback & Scale Down Broken Green Release"
        run: |
          echo "Smoke test failed! Resetting Load Balancer weights and scaling Green Fargate tasks to 0..."
          terraform apply -auto-approve -input=false
        env:
          TF_VAR_green_container_image: "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}"
          TF_VAR_blue_traffic_weight: 100
          TF_VAR_green_traffic_weight: 0
          TF_VAR_green_ecs_scale: 1 # 🧹 Scales Green tasks to exactly 0, killing the containers cleanly!
          