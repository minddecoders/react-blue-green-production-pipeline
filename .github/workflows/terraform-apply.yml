name: "GitOps - Auto Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Target Infrastructure Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

      existing_image_tag:
        description: "Existing Docker tag (e.g. v1.10). Leave blank to build a new image."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  IMAGE_REPOSITORY: minddecoders/react-recipeapp-blue-green-production
  RELEASE_VERSION: ${{ inputs.existing_image_tag != '' && inputs.existing_image_tag || format('v1.{0}', github.run_number) }}

jobs:

  # ============================================================
  # JOB 1: BUILD A NEW IMAGE ONLY WHEN NO EXISTING TAG IS GIVEN
  # ============================================================
  build-and-push-image:
    name: "Build and Push React Image"
    if: ${{ inputs.existing_image_tag == '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Release Version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Versioned Image
        uses: docker/build-push-action@v6
        with:
          context: ./react-recipe-app
          file: ./react-recipe-app/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_VERSION }}

  # ============================================================
  # JOB 2: DEPLOY GREEN WITH ZERO LIVE TRAFFIC
  # ============================================================
  terraform-stage-green:
    name: "Deploy Green Tier (0% Live Traffic)"
    runs-on: ubuntu-latest
    needs: build-and-push-image

    # Continue if image build succeeded OR was intentionally skipped.
    if: >-
      ${{
        always() &&
        (
          needs.build-and-push-image.result == 'success' ||
          needs.build-and-push-image.result == 'skipped'
        )
      }}
      
    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    outputs:
      alb_dns: ${{ steps.parse_outputs.outputs.ALB_DNS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Select or Create Workspace
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          terraform workspace select "$TARGET_ENVIRONMENT" ||
            terraform workspace new "$TARGET_ENVIRONMENT"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan - Green Staging
        run: terraform plan -input=false
        env:
          TF_VAR_green_container_image: ${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_VERSION }}
          TF_VAR_blue_traffic_weight: 100
          TF_VAR_green_traffic_weight: 0

      - name: Terraform Apply - Green Staging
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_green_container_image: ${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_VERSION }}
          TF_VAR_blue_traffic_weight: 100
          TF_VAR_green_traffic_weight: 0

      - name: Collect ALB DNS
        id: parse_outputs
        run: |
          ALB_RAW=$(terraform output -raw alb_dns_name)
          echo "ALB_DNS=$ALB_RAW" >> "$GITHUB_OUTPUT"

  # ============================================================
  # JOB 3: GREEN SMOKE TEST
  # ============================================================
  automated-health-test:
    name: "Run Green Smoke and Health Tests"
    runs-on: ubuntu-latest
    needs: terraform-stage-green
    if: ${{ always() && needs.terraform-stage-green.result == 'success' }}

    steps:
      - name: Verify Green HTTP Health
        shell: bash
        env:
          ALB_DNS: ${{ needs.terraform-stage-green.outputs.alb_dns }}
        run: |
          set -u

          if [ -z "$ALB_DNS" ]; then
            echo "ERROR: ALB DNS output is empty."
            exit 1
          fi

          TARGET_URL="$ALB_DNS"

          if [[ "$TARGET_URL" != http://* && "$TARGET_URL" != https://* ]]; then
            TARGET_URL="http://$TARGET_URL"
          fi

          for i in {1..12}; do
            if python3 - "$TARGET_URL" <<'PY'
          import re
          import sys
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          base_url = sys.argv[1]
          headers = {"X-Blue-Green-Test": "true"}

          try:
              request = Request(base_url, headers=headers)

              with urlopen(request, timeout=10) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}")

                  html = response.read().decode("utf-8", errors="replace")

              scripts = re.findall(
                  r'<script[^>]+src=["\']([^"\']+\.js[^"\']*)["\']',
                  html,
                  re.IGNORECASE,
              )
              if not scripts:
                  raise RuntimeError("No JavaScript bundle found in HTML")

              for script in scripts:
                  request = Request(
                      urljoin(base_url, script),
                      headers=headers
                  )

                  with urlopen(request, timeout=10) as response:
                      if response.status != 200:
                          raise RuntimeError(
                              f"JavaScript bundle HTTP {response.status}"
                          )

                      bundle = response.read().decode(
                          "utf-8", errors="replace"
                      )

                  if bundle.strip():
                      print(
                          "SUCCESS: Green returned HTTP 200 "
                          "and a non-empty JavaScript bundle."
                      )
                      sys.exit(0)

              raise RuntimeError("JavaScript bundles were empty")

          except Exception as exc:
              print(f"Smoke test failed: {exc}")
              sys.exit(1)
          PY
            then
              exit 0
            fi

            echo "Attempt $i/12 failed. Retrying in 5 seconds..."

            if [ "$i" -lt 12 ]; then
              sleep 5
            fi
          done

          echo "ERROR: Green smoke test failed after 12 attempts."
          exit 1

  # ============================================================
  # JOB 4: MANUAL APPROVAL AND TRAFFIC PROMOTION
  # ============================================================
  promote-green-to-live:
    name: "Promote Green to Production"
    runs-on: ubuntu-latest
    needs: automated-health-test
    environment: production-gate

    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Select Workspace
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: terraform workspace select "$TARGET_ENVIRONMENT"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Plan Traffic Promotion
        run: terraform plan -input=false
        env:
          TF_VAR_green_container_image: ${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_VERSION }}
          TF_VAR_blue_traffic_weight: 0
          TF_VAR_green_traffic_weight: 100

      - name: Switch ALB Traffic to Green
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_green_container_image: ${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_VERSION }}
          TF_VAR_blue_traffic_weight: 0
          TF_VAR_green_traffic_weight: 100

      - name: Record Approved Production Image
        run: |
          aws ssm put-parameter \
            --name "/current/react-recipeapp-blue-green-image" \
            --type "String" \
            --value "${IMAGE_REPOSITORY}:${RELEASE_VERSION}" \
            --overwrite \
            --region eu-west-1
        env:
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}

  # ============================================================
  # JOB 5: CLEAN UP GREEN AFTER A FAILED SMOKE TEST
  # ============================================================
  automated-rollback-cleanup:
    name: "Reset Traffic and Scale Down Failed Green"
    runs-on: ubuntu-latest
    needs:
      - terraform-stage-green
      - automated-health-test

    if: >-
      ${{
        always() &&
        needs.terraform-stage-green.result == 'success' &&
        needs.automated-health-test.result == 'failure'
      }}

    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Select Workspace
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: terraform workspace select "$TARGET_ENVIRONMENT"

      - name: Reset Traffic and Scale Down Green
        run: |
          terraform apply -auto-approve -input=false
        env:
          TF_VAR_green_container_image: ${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_VERSION }}
          TF_VAR_blue_traffic_weight: 100
          TF_VAR_green_traffic_weight: 0
          TF_VAR_green_ecs_scale: 0
