name: "GitOps - Auto Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Target Infrastructure Environment Workspace Tier to Deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write # 🔑 Grants permission to dynamically mint keyless AWS OIDC tokens!

# 🏷️ GLOBAL DYNAMIC VERSIONING
# This automatically calculates a unique, immutable version string per pipeline run (e.g., v1.42)
env:
  RELEASE_VERSION: "v1.${{ github.run_number }}"

jobs:
  # ============================================================================
  # JOB 1: AUTOMATED VITE-REACT DOCKERIZATION ENGINE
  # ============================================================================
  build-and-push-image:
    name: "Compile React Code & Push to DockerHub"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Codebase Repository"
        uses: actions/checkout@v4

      # 🔐 SECURE REGISTRY LOGIN: Logs into DockerHub using your secrets parameters
      - name: "Log in to DockerHub Registry"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🐳 HIGH-SCALE COMPILATION GATE: Builds your real Vite React project via your multi-stage Dockerfile!
      - name: "Build Production Multi-Stage Container Image"
        uses: docker/build-push-action@v5
        with:
          context: ./react-recipe-app # Targets your fresh React source code folder!
          file: ./react-recipe-app/Dockerfile
          push: true
          tags: |
            minddecoders/react-recipeapp-blue-green-production:latest
            minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}
       
  # ============================================================================
  # JOB 2: STAGE IMMUTABLE GREEN ENVIRONMENT (0% Live Traffic)
  # ============================================================================
  terraform-stage-green:
    name: "Deploy Green Tier (Offline Staging)"
    runs-on: ubuntu-latest
    needs: build-and-push-image # 🏎️ SEQUENTIAL LOCK: Waits for the Docker image to build successfully first!
    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: "Checkout Repository Code"
        uses: actions/checkout@v4

      # 🔑 100% KEYLESS HANDSHAKE: Authenticates to AWS cleanly using your secure OIDC provider
      - name: "Authenticate to AWS using OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: "Initialize S3 Remote Backend Connection"
        run: terraform init -input=false

      # 📁 DYNAMIC ENVIRONMENT ROUTING: Switches seamlessly into the selected workspace room
      - name: "Select or Create Target Workspace Environment"
        run: |
          terraform workspace select ${{ github.event.inputs.environment }} || terraform workspace new ${{ github.event.inputs.environment }}

      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive

      - name: "Execute Code Semantics Validation Gate"
        run: terraform validate
      
      # ✨ Generates your plan securely mapping the new version to Green
      - name: "Generate Live Cloud Infrastructure Plan"
        run: terraform plan -input=false
        env:
          TF_VAR_green_container_image: "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}"
          TF_VAR_blue_traffic_weight: 100
          TF_VAR_green_traffic_weight: 0

      # 🚀 Safely deploys the new code version to Green while users stay untouched on Blue
      - name: "Generate and Apply Live Cloud Infrastructure"
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_green_container_image: "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}"
          TF_VAR_blue_traffic_weight: 100
          TF_VAR_green_traffic_weight: 0

  # ============================================================================
  # JOB 3: THE SWAP CONTROLLER (Flips Traffic to 100% Green Instantly)
  # ============================================================================
  promote-green-to-live:
    name: "Execute Zero-Downtime Traffic Switch"
    runs-on: ubuntu-latest
    needs: terraform-stage-green # 🔒 Runs ONLY after the green infrastructure is completely ready!
    
    # 🌟 FIXED FOR PRODUCTION GATE: Enforces the manual review pause button!
    environment: production-gate
    
    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: "Checkout Repository Code"
        uses: actions/checkout@v4

      # 🔑 Authenticate to AWS cleanly using your secure OIDC provider
      - name: "Authenticate to AWS using OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: "Initialize S3 Remote Backend Connection"
        run: terraform init -input=false

      - name: "Select Active Workspace"
        run: terraform workspace select ${{ github.event.inputs.environment }}

      # 🎛️ THE FLIP: Instructs the Application Load Balancer to shift 100% of traffic to Green instantly
      # We target only the listener rule to avoid resetting unpassed container configuration variables!
      - name: "Modify ALB Rules (Blue: 0% / Green: 100%)"
        run: terraform apply -auto-approve -target=aws_lb_listener_rule.blue_green_router -input=false
        env:
          TF_VAR_green_container_image: "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}"
          TF_VAR_blue_traffic_weight: 0
          TF_VAR_green_traffic_weight: 100
