name: "GitOps - Auto Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Target Infrastructure Environment Workspace Tier to Deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write # 🔑 Grants permission to dynamically mint keyless AWS OIDC tokens!

# 🏷️ GLOBAL DYNAMIC RELEASE VERSION
env:
  RELEASE_VERSION: "v1.${{ github.run_number }}"

jobs:

  # 🐳 JOB 1: BUILD & PUSH DOCKER IMAGE
  build-and-push-image:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Login to DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build & Push Versioned Image"
        uses: docker/build-push-action@v5
        with:
          context: ./react-recipe-app
          file: ./react-recipe-app/Dockerfile
          push: true
          tags: |
            minddecoders/react-recipeapp-blue-green-production:latest
            minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}

  # 🟢 JOB 2: DEPLOY GREEN ENVIRONMENT WITH ZERO LIVE TRAFFIC
  terraform-stage-green:
    name: "Stage Green Environment"
    runs-on: ubuntu-latest
    needs: build-and-push-image

    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    outputs:
      alb_dns: ${{ steps.parse_outputs.outputs.ALB_DNS }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Configure AWS Credentials via OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: "Terraform Init"
        run: terraform init

      - name: "Select or Create Workspace"
        run: |
          terraform workspace select "${{ inputs.environment }}" || \
          terraform workspace new "${{ inputs.environment }}"

      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive

      - name: "Terraform Validate"
        run: terraform validate

      - name: "Plan Green Environment"
        run: terraform plan -input=false
        env:
          TF_VAR_green_container_image: "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}"
          TF_VAR_green_ecs_scale: "1"
          TF_VAR_blue_traffic_weight: "100"
          TF_VAR_green_traffic_weight: "0"

      - name: "Apply Green Environment"
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_green_container_image: "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}"
          TF_VAR_green_ecs_scale: "1"
          TF_VAR_blue_traffic_weight: "100"
          TF_VAR_green_traffic_weight: "0"

      - name: "Collect Dynamic Telemetry Context"
        id: parse_outputs
        run: |
          ALB_RAW=$(terraform output -raw alb_dns_name)
          echo "ALB_DNS=${ALB_RAW}" >> "$GITHUB_OUTPUT"

  # 🧪 JOB 3: AUTOMATED GREEN SMOKE & HEALTH TEST
  automated-health-test:
    name: "Run Smoke & Health Tests"
    runs-on: ubuntu-latest
    needs: terraform-stage-green

    steps:
      - name: "Execute Endpoint Validation Assertions"
        shell: bash
        run: |
          TARGET_URL="${{ needs.terraform-stage-green.outputs.alb_dns }}"

          if [ -z "$TARGET_URL" ]; then
            echo "ERROR: ALB DNS output is empty."
            exit 1
          fi

          # Normalize the URL to prevent duplicate http:// prefixes.
          TARGET_URL="${TARGET_URL#http://}"
          TARGET_URL="${TARGET_URL#https://}"
          TARGET_URL="http://${TARGET_URL}"

          echo "Starting Green environment smoke test..."
          echo "Target: $TARGET_URL"

          for i in {1..12}; do
            CURL_EXIT=0

            STATUS_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 \
              --max-time 10 \
              -H "X-Blue-Green-Test: true" \
              "$TARGET_URL") || CURL_EXIT=$?

            if [ "$CURL_EXIT" -eq 0 ] && [ "$STATUS_CODE" = "200" ]; then
              echo "SUCCESS: Green environment returned HTTP 200 OK!"
              exit 0
            fi

            echo "Attempt $i/12: curl exit=$CURL_EXIT, HTTP_RESPONSE=${STATUS_CODE:-none}"

            if [ "$i" -lt 12 ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "ERROR: Green smoke test failed after 12 attempts."
          exit 1

  # 🚦 JOB 4: MANUAL APPROVAL & ZERO-DOWNTIME TRAFFIC SWITCH
  promote-green-to-live:
    name: "Execute Zero-Downtime Traffic Switch"
    runs-on: ubuntu-latest
    needs: automated-health-test

    environment: production-gate

    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Configure AWS Credentials via OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: "Terraform Init"
        run: terraform init

      - name: "Select Deployment Workspace"
        run: terraform workspace select "${{ inputs.environment }}"

      - name: "Modify ALB Rules (Blue: 0% / Green: 100%)"
        run: terraform apply -auto-approve -target=aws_lb_listener_rule.blue_green_router -input=false
        env:
          TF_VAR_green_container_image: "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}"
          TF_VAR_green_ecs_scale: "1"
          TF_VAR_blue_traffic_weight: "0"
          TF_VAR_green_traffic_weight: "100"

      - name: "Update Current Production Image"
        run: |
          aws ssm put-parameter \
            --name "/current/react-recipeapp-blue-green-image" \
            --type "String" \
            --value "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}" \
            --overwrite \
            --region eu-west-1

  # 🔄 JOB 5: AUTOMATED ROLLBACK IF GREEN HEALTH TEST FAILS
  automated-rollback-cleanup:
    name: "Tear Down Broken Green Release"
    runs-on: ubuntu-latest
    needs: automated-health-test
    if: ${{ always() && needs.automated-health-test.result == 'failure' }}

    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Configure AWS Credentials via OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: "Terraform Init"
        run: terraform init

      - name: "Select Deployment Workspace"
        run: terraform workspace select "${{ inputs.environment }}"

      - name: "Rollback & Scale Down Broken Green Release"
        run: |
          echo "Smoke test failed! Restoring Blue traffic and scaling Green to 0..."
          terraform apply -auto-approve -input=false
        env:
          TF_VAR_green_container_image: "minddecoders/react-recipeapp-blue-green-production:${{ env.RELEASE_VERSION }}"
          TF_VAR_green_ecs_scale: "0"
          TF_VAR_blue_traffic_weight: "100"
          TF_VAR_green_traffic_weight: "0"
